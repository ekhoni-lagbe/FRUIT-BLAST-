<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">

<title>ফল ধামাকা</title>
<style>

:root{--bg:#1a0b3b;--card:#2a1660;--text:#fff;--muted:#c9b8ff;--gold:#ffc83d;--pink:#ff4d9d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:radial-gradient(circle at 50% 0,#5a2bb5,var(--bg) 65%);color:var(--text);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:420px;margin:0 auto;padding:12px}
h1{margin:4px 0 8px;text-align:center;font-size:1.45rem;background:linear-gradient(90deg,#ffc83d,#ff4d9d,#9b5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ad{border:1px dashed #5a3fa8;border-radius:10px;color:var(--muted);text-align:center;font-size:.75rem;padding:10px;margin:8px 0;min-height:50px;display:flex;align-items:center;justify-content:center}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.hud div{background:var(--card);border-radius:10px;padding:5px 2px;text-align:center;font-size:.7rem;color:var(--muted);border:1px solid #4a2d9a}
.hud b{display:block;font-size:1.15rem;color:var(--gold)}
.pb{height:12px;border-radius:8px;background:#0006;margin-bottom:10px;overflow:hidden;border:1px solid #4a2d9a}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc83d,#ff4d9d);transition:width .3s}
.stage{position:relative}
#bd{position:relative;width:100%;aspect-ratio:1;background:linear-gradient(160deg,#35197a,#241052);border-radius:16px;border:2px solid #5a3fa8;box-shadow:0 8px 30px #0008;touch-action:none;overflow:hidden}
.t{position:absolute;width:12.5%;height:12.5%;padding:2px;display:flex;align-items:center;justify-content:center;transition:top .22s ease-in,left .2s;font-size:clamp(20px,8.4vw,36px);line-height:1}
.t span{width:100%;height:100%;border-radius:30%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 #0004,inset 0 3px 0 #fff4}
.t.sel span{outline:3px solid #fff;transform:scale(1.1)}
.t.pop{transition:transform .25s,opacity .25s;transform:scale(1.5) rotate(20deg);opacity:0}
.say{position:absolute;left:0;right:0;top:40%;text-align:center;font-weight:800;font-size:2rem;color:var(--gold);text-shadow:0 3px 0 #000a;pointer-events:none;opacity:0;transition:opacity .2s}
.ov{position:absolute;inset:0;background:#1a0b3bee;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;overflow:auto;z-index:3}
.ov.hide{display:none}
.ov h2{margin:0 0 4px;font-size:1.5rem}
.ov p{margin:2px 0 12px;color:var(--muted);font-size:.9rem}
.btn{border:0;border-radius:14px;padding:12px 26px;font:inherit;font-weight:800;font-size:1.05rem;color:#201400;background:linear-gradient(180deg,#ffe07a,var(--gold));box-shadow:0 5px 0 #b98400;cursor:pointer;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b98400}
.btn.alt{background:linear-gradient(180deg,#ff7ab8,var(--pink));color:#fff;box-shadow:0 5px 0 #b02a6c}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;margin:6px 0 12px}
.grid button{aspect-ratio:1;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:1rem;color:#fff;background:linear-gradient(180deg,#34e8a8,#11a373);cursor:pointer}
.grid button.cur{background:linear-gradient(180deg,#ffe07a,var(--gold));color:#201400}
.grid button:disabled{background:#3a2a80;color:#8f7fd0;cursor:not-allowed}
.tip{text-align:center;color:var(--muted);font-size:.82rem;margin:8px 0}

body{font-family:"Noto Sans Bengali","Noto Sans Devanagari","Hind Siliguri","Hind",system-ui,sans-serif}
@media(min-width:700px){.wrap{max-width:600px}}
#game{margin:0 -9px}
@media(min-width:700px){#game{margin:0}}
.t{font-size:clamp(22px,9vw,54px)}
.hide{display:none!important}
.cd{background:var(--card);border:1px solid #5a3fa8;border-radius:14px;padding:12px;margin:10px 0}
.cd h3{margin:0 0 8px;font-size:1rem;color:var(--gold)}
.hello{text-align:center;font-size:1.8rem;font-weight:800;margin:8px 0 2px}
.wsub{text-align:center;color:var(--muted);font-size:.9rem;margin:0 0 6px}
#adGame{padding:0;overflow:hidden}
.lg{display:flex;justify-content:center;gap:6px;margin:0 0 6px}
.lg button{border:1px solid #5a3fa8;background:#2a1660;color:var(--muted);border-radius:20px;padding:6px 14px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.lg button.on{background:var(--gold);color:#201400;border-color:var(--gold)}
.grid.lv{grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.grid.lv button{font-size:.9rem}
.grid.lv button.dn{background:linear-gradient(180deg,#34e8a8,#11a373)}
.pn{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.pn button,.sv button{border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:800;background:#ffffff22;color:#fff;cursor:pointer}
.pn button:disabled{opacity:.3}
.sv{font-size:.75rem;color:var(--muted);margin-top:8px}
.sv input{width:120px;padding:5px;border-radius:6px;border:1px solid #5a3fa8;background:#0006;color:#fff;font:inherit}
.rl{font-size:.88rem;line-height:1.7;color:var(--muted)}
.ac{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.ac .btn{padding:10px 16px;font-size:.92rem;margin:0}
.sm{display:grid;grid-template-columns:1fr 1fr .8fr;gap:6px;margin-top:10px}
.sb{border:0;border-radius:14px;padding:7px 6px;min-height:36px;font:inherit;font-size:.7rem;font-weight:700;line-height:1.25;color:#fff;background:#ffffff22;cursor:pointer}
.sb.bk{background:linear-gradient(180deg,#ff7ab8,#ff4d9d);font-size:.82rem;box-shadow:0 3px 0 #a02a62}
.sb.h{background:linear-gradient(180deg,#ffe07a,#ffc83d);color:#201400}
.sb.v{background:linear-gradient(180deg,#9b85ff,#6a4cf0)}
.t.hint{z-index:6}
.t.hint span{outline:3px solid #fff;animation:hp .5s infinite alternate}
.t.hint::after{content:attr(data-ar);position:absolute;right:-4px;top:-6px;font-size:.5em;filter:drop-shadow(0 1px 2px #000)}
@keyframes hp{to{transform:scale(1.12)}}
.md{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.md.hide{display:none}
.mc{background:var(--card);border:2px solid #5a3fa8;border-radius:16px;padding:16px;text-align:center;max-width:360px;width:100%}
.mc h3{margin:0 0 4px}.mc p{margin:2px 0 8px;color:var(--muted);font-size:.85rem}
.rad{min-height:120px;margin:8px auto;display:flex;align-items:center;justify-content:center;border:1px dashed #5a3fa8;border-radius:10px;color:var(--muted);font-size:.8rem;overflow:hidden}
.snd{position:fixed;top:8px;right:8px;z-index:40;width:38px;height:38px;border-radius:50%;border:1px solid #5a3fa8;background:#2a1660dd;color:#fff;font-size:1.05rem;cursor:pointer;padding:0}
.off{position:fixed;inset:0;z-index:80;background:#1a0b3bf5;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff}
.off p{color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;font-weight:700;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
<script src="ads-config.js"></script>
</head>

slot($('rad'),A.display||A.reward,DS[0],DS[1]);clearInterval(rtm);
rtm=setInterval(function(){left--;if(left<=0){clearInterval(rtm);$('mok').disabled=false;$('mok').textContent=t('close')}else $('mok').textContent='⏳ '+num(left)},1000);
$('mok').onclick=function(){if($('mok').disabled)return;m.className='md hide';cb()}}
$('bHint').onclick=function(){if(phase!=='play'||busy)return;if(hintLeft>0){showHint();return}
reward('hint0',function(){if(phase!=='play')return;hintLeft=1;hud();showHint()})};
$('bSkip').onclick=function(){if(phase!=='play'||busy)return;reward('skip0',doSkip)};

/* ---- বন্ধু / ইনস্টল / নাম / ভাষা ---- */
$('bFr').onclick=function(){var d={title:t('title').replace('🍓 ',''),text:t('shareT'),url:location.href};
if(navigator.share){navigator.share(d).catch(function(){})}else{try{navigator.clipboard.writeText(d.url);msg(t('shareC'))}catch(e){prompt(t('shareC'),d.url)}}};
var dp=null,isIos=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone,inst=window.matchMedia&&matchMedia('(display-mode: standalone)').matches;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
window.addEventListener('appinstalled',function(){$('bIns').hidden=true});
if(!inst)$('bIns').hidden=false;
$('bIns').onclick=function(){if(dp){dp.prompt();dp=null}else alert(isIos?t('ios'):t('insHelp'))};
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('app-sw.js').catch(function(){});
/* অনলাইন ছাড়া খেলা যাবে না */
function netChk(){$('off').classList.toggle('hide',navigator.onLine!==false)}
window.addEventListener('online',netChk);window.addEventListener('offline',netChk);

function applyLang(){document.documentElement.lang=LG[lang];document.title=t('title').replace('🍓 ','');
Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=t(e.dataset.i)});
Array.prototype.forEach.call(document.querySelectorAll('.lg button'),function(b){b.classList.toggle('on',b.dataset.g===LG[lang])});
$('rl').innerHTML=t('rules');hud();
if(phase==='menu')renderHome(pg);else if(phase==='over')renderEnd()}
Array.prototype.forEach.call(document.querySelectorAll('.lg button'),function(b){b.onclick=function(){lang=LG.indexOf(b.dataset.g);lset('fd_lang',b.dataset.g);cset('fd_lang',b.dataset.g);applyLang()}});

mountAds('home');sndBtn();applyLang();renderHome();netChk();
})();
</script>
